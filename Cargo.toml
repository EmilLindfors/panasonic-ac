[package]
name = "panasonic-ac"
version = "0.2.1"
edition = "2021"
authors = ["Panasonic AC Contributors"]
description = "Rust library for controlling Panasonic heat pumps and air conditioners via IR"
repository = "https://github.com/EmilLindfors/panasonic-ac-rs"
license = "MIT"
keywords = ["ir", "hvac", "panasonic", "ac", "heatpump"]
categories = ["hardware-support", "embedded", "api-bindings"]
readme = "README.md"

[dependencies]
# Error handling
thiserror = "1.0"

# Bit manipulation
bitvec = "1.0"

# Hardware support
rppal = { version = "0.14", optional = true }
embedded-hal = { version = "0.2", optional = true }
lazy_static = "1.4"

# Logging
log = "0.4"

[dev-dependencies]
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }

[dependencies.clap]
version = "4.4"
features = ["derive"]
optional = true

[dependencies.env_logger]
version = "0.10"
optional = true

[dependencies.chrono]
version = "0.4"
optional = true

[features]
default = ["mock"]
mock = []     # Mock hardware for testing
rpi = ["rppal", "embedded-hal"]  # Raspberry Pi hardware support
builder = []  # Builder pattern support
diff = []     # State diff functionality
cli = ["clap", "env_logger", "chrono"]  # CLI binary dependencies
test-rpi = ["rpi", "mock"]  # Feature for running Raspberry Pi tests

[[example]]
name = "ac_control"
path = "examples/ac_control.rs"

[[example]]
name = "decode_ir"
path = "examples/decode_ir.rs"

[[example]]
name = "smart_controller"
path = "examples/smart_controller.rs"

# Hardware example
[[example]]
name = "raspberry_pi"
path = "examples/raspberry_pi.rs"
required-features = ["rpi"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "panasonic-rpi"
path = "src/bin/panasonic_rpi.rs"
required-features = ["rpi", "cli"]
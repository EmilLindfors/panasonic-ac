name: Release

on:
  push:
    tags:
      - 'v*'  # Run when tag matches v*, e.g. v1.0.0, v20.15.10-rc1

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build for standard architectures
  build_lib:
    name: Build Library
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-
    
    - name: Build library (Default)
      run: cargo build --release
    
    - name: Build library with RPi support
      run: cargo build --features rpi --release
    
    - name: Build CLI binary
      run: cargo build --bin panasonic-rpi --features rpi,cli --release
      
    - name: List target directory contents
      run: |
        echo "=== Listing target/release directory ==="
        find target/release -type f -name "libpanasonic_ac*" | sort
        echo "============================================"
    
    - name: Upload library artifact
      uses: actions/upload-artifact@v4
      with:
        name: panasonic-ac-lib-x86_64
        path: target/release/libpanasonic_ac*.so
        if-no-files-found: warn
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: panasonic-rpi-x86_64
        path: target/release/panasonic-rpi*
        if-no-files-found: warn

  # Build for Raspberry Pi (ARMv7)
  build_armv7:
    name: Build for Raspberry Pi (ARMv7)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: armv7-unknown-linux-gnueabihf
        profile: minimal
        override: true
    
    - name: Install ARM toolchain and system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf libudev-dev
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: armv7-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: armv7-cargo-
    
    - name: Build library for Raspberry Pi
      run: cargo build --target armv7-unknown-linux-gnueabihf --features rpi --release
    
    - name: Build Raspberry Pi example
      run: cargo build --example raspberry_pi --target armv7-unknown-linux-gnueabihf --features rpi --release
    
    - name: Build CLI binary for Raspberry Pi
      run: cargo build --bin panasonic-rpi --target armv7-unknown-linux-gnueabihf --features rpi,cli --release
      
    - name: List ARM target directory contents
      run: |
        echo "=== Listing target/armv7-unknown-linux-gnueabihf/release directory ==="
        find target/armv7-unknown-linux-gnueabihf/release -type f | sort
        echo "=========================================================="
    
    - name: Upload library artifact
      uses: actions/upload-artifact@v4
      with:
        name: panasonic-ac-lib-armv7
        path: target/armv7-unknown-linux-gnueabihf/release/libpanasonic_ac*.so
        if-no-files-found: warn
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: panasonic-rpi-armv7
        path: target/armv7-unknown-linux-gnueabihf/release/panasonic-rpi*
        if-no-files-found: warn
    
    - name: Upload example
      uses: actions/upload-artifact@v4
      with:
        name: raspberry-pi-example-armv7
        path: target/armv7-unknown-linux-gnueabihf/release/examples/raspberry_pi*
        if-no-files-found: warn

  # Build for Raspberry Pi (AArch64 - 64-bit)
  build_aarch64:
    name: Build for Raspberry Pi (AArch64)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: aarch64-unknown-linux-gnu
        profile: minimal
        override: true
    
    - name: Install ARM64 toolchain and system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu libudev-dev
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: aarch64-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: aarch64-cargo-
    
    - name: Build library for Raspberry Pi (AArch64)
      run: cargo build --target aarch64-unknown-linux-gnu --features rpi --release
    
    - name: Build Raspberry Pi example (AArch64)
      run: cargo build --example raspberry_pi --target aarch64-unknown-linux-gnu --features rpi --release
    
    - name: Build CLI binary for Raspberry Pi (AArch64)
      run: cargo build --bin panasonic-rpi --target aarch64-unknown-linux-gnu --features rpi,cli --release
      
    - name: List ARM64 target directory contents
      run: |
        echo "=== Listing target/aarch64-unknown-linux-gnu/release directory ==="
        find target/aarch64-unknown-linux-gnu/release -type f | sort
        echo "=========================================================="
    
    - name: Upload library artifact
      uses: actions/upload-artifact@v4
      with:
        name: panasonic-ac-lib-aarch64
        path: target/aarch64-unknown-linux-gnu/release/libpanasonic_ac*.so
        if-no-files-found: warn
    
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: panasonic-rpi-aarch64
        path: target/aarch64-unknown-linux-gnu/release/panasonic-rpi*
        if-no-files-found: warn
    
    - name: Upload example
      uses: actions/upload-artifact@v4
      with:
        name: raspberry-pi-example-aarch64
        path: target/aarch64-unknown-linux-gnu/release/examples/raspberry_pi*
        if-no-files-found: warn

  # Create GitHub Release with all artifacts
  create_release:
    name: Create Release
    needs: [build_lib, build_armv7, build_aarch64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Package artifacts
        run: |
          mkdir -p release
          
          # Function to create tarball if directory exists and is not empty
          package_if_exists() {
            if [ -d "$1" ] && [ "$(ls -A $1)" ]; then
              echo "Packaging $1 to release/$2.tar.gz"
              tar -czvf "release/$2.tar.gz" "$1/"
            else
              echo "Directory $1 is empty or doesn't exist, skipping"
              touch "release/$2.tar.gz.empty"
            fi
          }
          
          package_if_exists "panasonic-ac-lib-x86_64" "panasonic-ac-lib-x86_64"
          package_if_exists "panasonic-rpi-x86_64" "panasonic-rpi-x86_64"
          package_if_exists "panasonic-ac-lib-armv7" "panasonic-ac-lib-armv7"
          package_if_exists "panasonic-rpi-armv7" "panasonic-rpi-armv7"
          package_if_exists "raspberry-pi-example-armv7" "raspberry-pi-example-armv7"
          package_if_exists "panasonic-ac-lib-aarch64" "panasonic-ac-lib-aarch64"
          package_if_exists "panasonic-rpi-aarch64" "panasonic-rpi-aarch64"
          package_if_exists "raspberry-pi-example-aarch64" "raspberry-pi-example-aarch64"
          
          # List what we've created
          ls -la release/
      
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: Prepare release files list
        id: release_files
        run: |
          FILES=""
          for f in release/*.tar.gz; do
            if [ -f "$f" ] && [ ! -f "$f.empty" ]; then
              FILES="$FILES$f\n"
            fi
          done
          echo "FILES<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Create Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Get the tag name and version
            const tag = context.ref.split('/').pop();
            const version = tag.replace(/^v/, '');
            
            console.log(`Creating release for tag ${tag} (version ${version})`);
            
            // Create the release
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Panasonic AC v${version}`,
              draft: false,
              prerelease: false,
              generate_release_notes: true
            });
            
            // Find all tar.gz files in the release directory
            const releaseDir = path.join(process.cwd(), 'release');
            const files = fs.readdirSync(releaseDir)
              .filter(file => file.endsWith('.tar.gz') && !file.endsWith('.empty'));
            
            console.log(`Found ${files.length} files to upload: ${files.join(', ')}`);
            
            // Upload each asset
            for (const file of files) {
              const filePath = path.join(releaseDir, file);
              const stats = fs.statSync(filePath);
              
              if (stats.size === 0) {
                console.log(`Skipping empty file: ${file}`);
                continue;
              }
              
              console.log(`Uploading: ${file} (${stats.size} bytes)`);
              
              const uploadUrl = release.data.upload_url;
              const contentLength = stats.size;
              const contentType = 'application/gzip';
              
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: file,
                data: fs.readFileSync(filePath),
                headers: {
                  'content-type': contentType,
                  'content-length': contentLength
                }
              });
              
              console.log(`Successfully uploaded: ${file}`);
            }
            
            console.log('Release created successfully!');
name: Rust Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-
    
    - name: Run default tests
      run: cargo test --verbose
    
    - name: Run mock hardware tests
      run: cargo test --test mock_hardware_tests --verbose
    
    - name: Run Raspberry Pi tests
      run: cargo test --test rpi_hardware_tests --test rpi_integration_test --features test-rpi --verbose
    
    - name: Run CLI tests
      run: cargo test --test cli_tests --features "cli rpi" --verbose
      
    - name: Run Clippy with all features
      run: cargo clippy --all-features -- -D warnings
    
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: llvm-tools-preview
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - name: Generate code coverage
        run: |
          # Run coverage with all features first
          cargo llvm-cov --all-features --workspace --no-report
          
          # Run with all features explicitly to ensure nothing is missed
          cargo llvm-cov --features "mock,rpi,builder,diff,cli,test-rpi" --workspace --no-report
          
          # Run with specific feature combinations to ensure all tests are covered
          cargo llvm-cov --features "mock" --no-report
          cargo llvm-cov --features "rpi,mock" --no-report
          cargo llvm-cov --features "test-rpi" --no-report
          cargo llvm-cov --features "builder" --no-report
          cargo llvm-cov --features "cli,rpi" --no-report
          cargo llvm-cov --features "diff" --no-report
          
          # Generate the final report
          cargo llvm-cov report --lcov --output-path lcov.info
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          fail_ci_if_error: true
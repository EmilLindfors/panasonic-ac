name: Rust Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev

    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        override: true
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-
    
    - name: Run default tests
      run: cargo test --verbose
    
    - name: Run mock hardware tests
      run: cargo test --test mock_hardware_tests --verbose
    
    - name: Run Raspberry Pi tests
      run: cargo test --test rpi_hardware_tests --test rpi_integration_test --features test-rpi --verbose
    
    - name: Run CLI tests
      run: cargo test --test cli_tests --features "cli rpi" --verbose
      
    - name: Run Clippy with all features
      run: cargo clippy --all-features -- -D warnings
    
    - name: Build binary with all features
      run: cargo build --bin panasonic-rpi --features "rpi cli" --release  
    - name: Build binary with all features
      run: cargo build --bin panasonic-rpi --features "rpi cli" --release
    
